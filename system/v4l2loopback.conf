# Copy to /etc/modprobe.d/v4l2loopback.conf (needs root).
# video_nr=10 gives /dev/video10, so it can't collide with a real webcam on
# /dev/video0. The plugin finds the device by its label, so any free number
# works. exclusive_caps=1 is required for Chrome to list it.
options v4l2loopback devices=1 video_nr=10 card_label="DeckLink Virtual Camera" exclusive_caps=1
